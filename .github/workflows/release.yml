# Construit l'image Docker du backend à chaque tag vX.Y.Z et la publie sur ghcr.io.
# Le déploiement en production se fait ensuite à la main avec le workflow "Deploy".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/phronesis18/backpcp:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résumé
        run: |
          echo "Image prête : \`ghcr.io/phronesis18/backpcp:${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Pour la mettre en production : onglet **Actions** → **Deploy** → **Run workflow** → tag \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
